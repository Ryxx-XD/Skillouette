name: Skillouette CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Client Dependencies
        run: npm --prefix client ci || npm --prefix client install

      - name: Install Server Dependencies
        run: npm --prefix server ci || npm --prefix server install

      - name: Typecheck and Build Client & Server
        run: npm run build

      - name: Execute Automated Test Suite
        run: npm --prefix server run test
